<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karty zákazníka</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1d2230;
      --muted: #667085;
      --primary: #3056d3;
      --primary-dark: #2445ad;
      --accent: #16a34a;
      --danger: #dc2626;
      --border: #d0d5dd;
      --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    h1, h2, h3 {
      margin: 0 0 10px;
    }

    h1 {
      font-size: 1.4rem;
    }

    h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .muted {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .region-selector {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .btn.primary {
      background: var(--primary);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--primary-dark);
    }

    .btn.outline {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }

    .btn.danger {
      background: var(--danger);
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    form {
      display: grid;
      gap: 10px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
    }

    .capture-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .capture-box {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      background: #fbfcff;
    }

    .capture-box img {
      margin-top: 8px;
      width: 100%;
      height: 94px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e4e7ec;
      background: #fff;
    }

    .top-cards,
    .all-cards {
      display: grid;
      gap: 10px;
    }

    .card-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: #fff;
      display: grid;
      gap: 8px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      background: #eef4ff;
      color: var(--primary);
      border-radius: 20px;
      padding: 3px 9px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .thumb {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e4e7ec;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions .btn {
      flex: 1;
      padding: 9px 10px;
      font-size: 0.86rem;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="regionPanel" class="panel">
      <h1>Karty zákazníků</h1>
      <p class="muted">Nejdříve zvolte, jestli chcete pracovat s českými nebo slovenskými kartami.</p>
      <div class="region-selector">
        <button class="btn primary" data-region="CZ" type="button">České karty (CZ)</button>
        <button class="btn outline" data-region="SK" type="button">Slovenské karty (SK)</button>
      </div>
    </section>

    <section id="createPanel" class="panel hidden">
      <h2>Přidat novou kartu</h2>
      <form id="cardForm">
        <div>
          <label for="cardName">Název karty</label>
          <input id="cardName" name="cardName" required placeholder="Např. Tesco Clubcard" />
        </div>
        <div>
          <label for="cardCountry">Typ karty</label>
          <select id="cardCountry" name="cardCountry" required>
            <option value="CZ">Česká karta (CZ)</option>
            <option value="SK">Slovenská karta (SK)</option>
          </select>
        </div>

        <div class="capture-grid">
          <div class="capture-box">
            <label for="frontInput">Přední strana</label>
            <input id="frontInput" type="file" accept="image/*" capture="environment" required />
            <img id="frontPreview" alt="Náhled přední strany" src="" class="hidden" />
          </div>
          <div class="capture-box">
            <label for="backInput">Zadní strana</label>
            <input id="backInput" type="file" accept="image/*" capture="environment" required />
            <img id="backPreview" alt="Náhled zadní strany" src="" class="hidden" />
          </div>
        </div>

        <button class="btn primary" type="submit">Uložit kartu do mobilu</button>
      </form>
    </section>

    <section id="topPanel" class="panel hidden">
      <h2>6 nejpoužívanějších karet</h2>
      <div id="topCards" class="top-cards"></div>
    </section>

    <section id="allPanel" class="panel hidden">
      <h2>Abecední seznam všech karet</h2>
      <div id="allCards" class="all-cards"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "customerCardsV1";
    const REGION_KEY = "selectedCardRegion";

    const state = {
      selectedRegion: localStorage.getItem(REGION_KEY) || "",
      cards: JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")
    };

    const regionPanel = document.getElementById("regionPanel");
    const createPanel = document.getElementById("createPanel");
    const topPanel = document.getElementById("topPanel");
    const allPanel = document.getElementById("allPanel");

    const cardForm = document.getElementById("cardForm");
    const cardCountry = document.getElementById("cardCountry");
    const cardName = document.getElementById("cardName");

    const frontInput = document.getElementById("frontInput");
    const backInput = document.getElementById("backInput");
    const frontPreview = document.getElementById("frontPreview");
    const backPreview = document.getElementById("backPreview");

    const topCardsEl = document.getElementById("topCards");
    const allCardsEl = document.getElementById("allCards");

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.cards));
      localStorage.setItem(REGION_KEY, state.selectedRegion);
    }

    function toDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleImagePreview(input, imgEl) {
      const file = input.files?.[0];
      if (!file) {
        imgEl.classList.add("hidden");
        imgEl.src = "";
        return;
      }
      imgEl.src = await toDataUrl(file);
      imgEl.classList.remove("hidden");
    }

    function incrementUsage(cardId) {
      const card = state.cards.find((c) => c.id === cardId);
      if (!card) return;
      card.usage += 1;
      saveState();
      renderLists();
    }

    function deleteCard(cardId) {
      state.cards = state.cards.filter((c) => c.id !== cardId);
      saveState();
      renderLists();
    }

    function renderLists() {
      const filtered = state.cards.filter((card) => card.country === state.selectedRegion);

      const topCards = [...filtered]
        .sort((a, b) => b.usage - a.usage || a.name.localeCompare(b.name, "cs"))
        .slice(0, 6);

      const allCards = [...filtered].sort((a, b) => a.name.localeCompare(b.name, "cs"));

      topCardsEl.innerHTML = "";
      allCardsEl.innerHTML = "";

      if (topCards.length === 0) {
        topCardsEl.innerHTML = `<div class="empty">Zatím zde nejsou žádné karty.</div>`;
      } else {
        topCards.forEach((card) => topCardsEl.appendChild(createCardElement(card, true)));
      }

      if (allCards.length === 0) {
        allCardsEl.innerHTML = `<div class="empty">Abecední seznam je zatím prázdný.</div>`;
      } else {
        allCards.forEach((card) => allCardsEl.appendChild(createCardElement(card, false)));
      }
    }

    function createCardElement(card, fromTopList) {
      const wrapper = document.createElement("article");
      wrapper.className = "card-item";

      const from = fromTopList ? "top" : "all";

      wrapper.innerHTML = `
        <div class="card-head">
          <strong>${card.name}</strong>
          <span class="badge">Použití: ${card.usage}×</span>
        </div>
        <div class="muted">Typ: ${card.country}</div>
        <img class="thumb" src="${card.frontImage}" alt="Přední strana karty ${card.name}" />
        <div class="actions">
          <button class="btn outline" data-id="${card.id}" data-action="open-front" data-from="${from}" type="button">Přední</button>
          <button class="btn outline" data-id="${card.id}" data-action="open-back" data-from="${from}" type="button">Zadní</button>
          <button class="btn danger" data-id="${card.id}" data-action="delete" data-from="${from}" type="button">Smazat</button>
        </div>
      `;

      return wrapper;
    }

    function openImageInNewTab(dataUrl, cardId) {
      const opened = window.open();
      if (opened) {
        opened.document.write(`<img src="${dataUrl}" alt="Náhled karty" style="max-width:100%;height:auto;"/>`);
      }
      incrementUsage(cardId);
    }

    function applyRegion(region) {
      state.selectedRegion = region;
      cardCountry.value = region;
      createPanel.classList.remove("hidden");
      topPanel.classList.remove("hidden");
      allPanel.classList.remove("hidden");
      saveState();
      renderLists();
    }

    document.querySelectorAll("[data-region]").forEach((btn) => {
      btn.addEventListener("click", () => applyRegion(btn.dataset.region));
    });

    frontInput.addEventListener("change", () => handleImagePreview(frontInput, frontPreview));
    backInput.addEventListener("change", () => handleImagePreview(backInput, backPreview));

    cardForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!frontInput.files?.[0] || !backInput.files?.[0]) return;

      const frontImage = await toDataUrl(frontInput.files[0]);
      const backImage = await toDataUrl(backInput.files[0]);

      const card = {
        id: crypto.randomUUID(),
        name: cardName.value.trim(),
        country: cardCountry.value,
        frontImage,
        backImage,
        usage: 0,
        createdAt: new Date().toISOString()
      };

      state.cards.push(card);
      saveState();
      cardForm.reset();
      frontPreview.classList.add("hidden");
      backPreview.classList.add("hidden");
      renderLists();
    });

    function attachActions(container) {
      container.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLButtonElement)) return;

        const cardId = target.dataset.id;
        const action = target.dataset.action;
        if (!cardId || !action) return;

        const card = state.cards.find((c) => c.id === cardId);
        if (!card) return;

        if (action === "open-front") openImageInNewTab(card.frontImage, cardId);
        if (action === "open-back") openImageInNewTab(card.backImage, cardId);
        if (action === "delete") {
          const confirmed = window.confirm(`Opravdu smazat kartu \"${card.name}\"?`);
          if (confirmed) deleteCard(cardId);
        }
      });
    }

    attachActions(topCardsEl);
    attachActions(allCardsEl);

    if (state.selectedRegion) {
      applyRegion(state.selectedRegion);
    }
  </script>
</body>
</html>
